name: Nightly mutants

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: The commit a backfill slice starts after. Leave it empty for the nightly range
        default: ""
        type: string
      head:
        description: The commit a backfill slice ends at. Defaults to the ref's head
        default: ""
        type: string

concurrency:
  group: nightly-mutants
  cancel-in-progress: false

permissions:
  contents: read

env:
  CACHIX_CACHE: rslisp
  DIFF: git.diff
  ISSUE_TITLE: Nightly mutants
  BACKFILL_ISSUE_TITLE: Mutants backfill
  INSTA_UPDATE: "no"
  TOOLS: ${{ github.workspace }}/mutation-tools

jobs:
  plan:
    if: github.ref == 'refs/heads/main' || (inputs.base || '') != '' || (inputs.head || '') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      base: ${{ steps.plan.outputs.base }}
      skipped: ${{ steps.plan.outputs.skipped }}
      head: ${{ steps.plan.outputs.head }}
      changed-sources: ${{ steps.plan.outputs.changed-sources }}
      shards: ${{ steps.mutants.outputs.shards }}
      shard-count: ${{ steps.mutants.outputs.shard-count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          persist-credentials: false
          path: mutation-tools
          sparse-checkout: |
            .github/mutation
            .github/actions
      - id: plan
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_INPUT: ${{ inputs.base }}
          HEAD_INPUT: ${{ inputs.head }}
        run: bash "$TOOLS/.github/mutation/plan.sh"
      - name: Check out the head of the range
        if: steps.plan.outputs.changed-sources != '0'
        env:
          HEAD_COMMIT: ${{ steps.plan.outputs.head }}
        run: git checkout --quiet "$HEAD_COMMIT"
      - uses: ./mutation-tools/.github/actions/dev-shell
        if: steps.plan.outputs.changed-sources != '0'
      - id: mutants
        name: List the mutants of the diff
        if: steps.plan.outputs.changed-sources != '0'
        env:
          MUTANTS: ${{ runner.temp }}/mutants
          BASE_INPUT: ${{ inputs.base }}
        run: nix develop .#mutation -c bash "$TOOLS/.github/mutation/write-generated-mutants.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.plan.outputs.changed-sources != '0'
        with:
          name: mutants
          path: ${{ runner.temp }}/mutants/

  baseline:
    needs: plan
    if: needs.plan.outputs.shard-count != '' && needs.plan.outputs.shard-count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.head }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          persist-credentials: false
          path: mutation-tools
          sparse-checkout: |
            .github/mutation
            .github/actions
      - uses: ./mutation-tools/.github/actions/dev-shell
        timeout-minutes: 10
        with:
          build-cache: mutation
          save-build-cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutants
          path: ${{ runner.temp }}/mutants
      - name: Find the test sets that fail without a mutant
        timeout-minutes: 60
        env:
          MUTANTS: ${{ runner.temp }}/mutants
          RESULTS: ${{ runner.temp }}/baseline
          CARGO_INCREMENTAL: "1"
          BUILD_SECONDS: 1500
          TEST_SECONDS: 900
        run: nix develop .#ci -c bash "$TOOLS/.github/mutation/baseline.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutant-baseline
          path: ${{ runner.temp }}/baseline/

  mutants:
    needs: [plan, baseline]
    if: needs.plan.outputs.shard-count != '' && needs.plan.outputs.shard-count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.head }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          persist-credentials: false
          path: mutation-tools
          sparse-checkout: |
            .github/mutation
            .github/actions
      - uses: ./mutation-tools/.github/actions/dev-shell
        timeout-minutes: 10
        with:
          build-cache: mutation
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutants
          path: ${{ runner.temp }}/mutants
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutant-baseline
          path: ${{ runner.temp }}/baseline
      - name: Test the mutants
        timeout-minutes: 105
        env:
          SHARD: ${{ matrix.shard }}
          MUTANTS: ${{ runner.temp }}/mutants
          RESULTS: ${{ runner.temp }}/results
          BASELINE_FAILURES: ${{ runner.temp }}/baseline/baseline-failures
          CARGO_INCREMENTAL: "1"
          BUILD_SECONDS: 1500
          TEST_SECONDS: 900
          SLOW_SECONDS: 5100
        run: nix develop .#ci -c bash "$TOOLS/.github/mutation/test-patches.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results/

  report:
    needs: [plan, baseline, mutants]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.plan.outputs.shard-count != '' && needs.plan.outputs.shard-count != '0'
        with:
          pattern: mutants-shard-*
          path: results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.plan.outputs.shard-count != '' && needs.plan.outputs.shard-count != '0'
        with:
          name: mutants
          path: mutants
      - name: Record the backfill slice
        if: (inputs.base || '') != ''
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ env.BACKFILL_ISSUE_TITLE }}
          BASE: ${{ needs.plan.outputs.base }}
          HEAD_COMMIT: ${{ needs.plan.outputs.head }}
          SHARD_COUNT: ${{ needs.plan.outputs.shard-count }}
          CHANGED_SOURCES: ${{ needs.plan.outputs.changed-sources }}
          MUTANTS: mutants
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/mutation/report-backfill.sh
      - name: Report the surviving mutants
        if: (inputs.base || '') == ''
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.plan.outputs.base }}
          SKIPPED: ${{ needs.plan.outputs.skipped }}
          HEAD_COMMIT: ${{ needs.plan.outputs.head }}
          SHARD_COUNT: ${{ needs.plan.outputs.shard-count }}
          MUTANTS: mutants
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/mutation/report.sh
      - name: Compare the mutants' seconds with their estimates
        if: ${{ !cancelled() && needs.plan.outputs.shard-count != '' && needs.plan.outputs.shard-count != '0' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          MUTANTS: mutants
        run: bash .github/mutation/check-estimates.sh
