name: Fresh agreement seeds

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: fresh-agreement-seeds
  cancel-in-progress: false

permissions:
  contents: read

env:
  CACHIX_CACHE: rslisp
  ISSUE_TITLE: Fresh-seed findings of cargo xtask agree
  SEEDS_PER_RUN: 500
  FIRST_FRESH_SEED: 1000000
  REDUCED_PER_RUN: 10
  REPORT: target/agree/report.md

jobs:
  fresh-seeds:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: coverage
      - name: Build the compiler
        run: nix develop .#ci -c cargo build --bin knave
      - name: Run and reduce fresh seeds
        run: |
          first=$((FIRST_FRESH_SEED + GITHUB_RUN_NUMBER * SEEDS_PER_RUN))
          nix develop .#ci -c cargo xtask agree --seeds "$first..$((first + SEEDS_PER_RUN))" \
            --reduce "$REDUCED_PER_RUN" --report "$REPORT" || test -f target/agree/findings.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fresh-agreement-findings
          path: target/agree/
          retention-days: 30

  comment:
    needs: fresh-seeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fresh-agreement-findings
          path: findings
      - name: Post the reduced findings outside the known classes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -f findings/report.md || exit 0
          issue=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number")
          { echo "Run: $RUN_URL"; echo; cat findings/report.md; } > comment.md
          gh issue comment "$issue" --body-file comment.md
