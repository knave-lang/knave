[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
knave-agree = { path = "agree" }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing", "visit", "visit-mut", "clone-impls"] }
