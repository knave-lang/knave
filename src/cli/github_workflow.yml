name: Knave

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the Knave version from {project-file}
        run: |
          versions=$(grep -v '^[[:space:]]*;' {project-file} | grep -o ':{version-key} "[^"]*"' | cut -d '"' -f 2 || true)
          test -n "$versions" || { echo "::error file={project-file}::{project-file} records no :{version-key} version"; exit 1; }
          test "$(echo "$versions" | wc -l)" -eq 1 || { echo "::error file={project-file}::{project-file} records more than one :{version-key} version"; exit 1; }
          echo "KNAVE_VERSION=$versions" >> "$GITHUB_ENV"
      - id: knave-cache
        uses: actions/cache/restore@v4
        with:
          path: &knave-files |
            ~/.cargo/bin/knave
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: knave-${{ env.KNAVE_VERSION }}-${{ runner.os }}
      - name: Install Knave
        run: cargo install knave --version "$KNAVE_VERSION" --locked
      - if: steps.knave-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *knave-files
          key: ${{ steps.knave-cache.outputs.cache-primary-key }}
      - name: Check the layout
        run: knave fmt --check
      - name: Lint
        run: knave lint
      - name: Test
        run: knave test
