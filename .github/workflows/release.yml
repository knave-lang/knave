name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish to crates.io, such as v0.9.3
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

env:
  CACHIX_CACHE: rslisp
  RELEASE_SUBJECT_PREFIX: Release v

defaults:
  run:
    shell: bash

jobs:
  release:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    outputs:
      tag: ${{ steps.push.outputs.pushed == 'true' && steps.tag.outputs.tag || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Find the commits since the latest release
        id: since
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ -n "$(git tag --points-at "$COMMIT" --list 'v*')" ]; then
            echo "$COMMIT is already a release"
          elif [ "$main" != "$COMMIT" ]; then
            echo "main moved to $main, whose run releases $COMMIT"
          else
            echo "latest=$latest" >> "$GITHUB_OUTPUT"
            echo "commits=$(git rev-list --reverse --first-parent "$latest..$COMMIT" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect their pull requests
        id: pulls
        if: steps.since.outputs.latest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS: ${{ steps.since.outputs.commits }}
        run: |
          for commit in $COMMITS; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$commit/pulls" \
              --jq '.[] | {number, title, labels: [.labels[].name]}' || exit 1
          done | jq -s 'unique_by(.number)' > pulls.json
          echo "labels=$(jq -r '[.[].labels[]] | unique | join(" ")' pulls.json)" >> "$GITHUB_OUTPUT"
      - if: steps.since.outputs.latest != ''
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - if: steps.since.outputs.latest != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Write the release notes
        if: steps.since.outputs.latest != ''
        run: nix develop .#ci -c cargo xtask release-notes pulls.json > notes.md
      - name: Commit and tag the release
        id: tag
        if: steps.since.outputs.latest != ''
        env:
          LATEST: ${{ steps.since.outputs.latest }}
          LABELS: ${{ steps.pulls.outputs.labels }}
        run: |
          read -ra labels <<< "$LABELS"
          tag=$(nix develop .#ci -c cargo xtask next-release "$LATEST" "${labels[@]}")
          nix develop .#ci -c cargo xtask set-version "${tag#v}"
          changed=$(git status --porcelain --untracked-files=no | awk '{print $2}' | sort | tr '\n' ' ')
          if [ "$changed" != "Cargo.lock Cargo.toml " ]; then
            echo "::error::set-version changed $changed instead of Cargo.lock and Cargo.toml"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "$RELEASE_SUBJECT_PREFIX${tag#v}" -- Cargo.toml Cargo.lock
          git tag "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.tag != ''
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Push the release commit and its tag
        id: push
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          remote="git@github.com:$GITHUB_REPOSITORY.git"
          if [ "$(git ls-remote "$remote" refs/heads/main | cut -f1)" != "$COMMIT" ]; then
            echo "main moved past $COMMIT, whose run releases it"
            exit 0
          fi
          git push --atomic "$remote" HEAD:refs/heads/main "refs/tags/$TAG"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the GitHub release
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PUBLISH_ATTEMPTS: 3
          SECONDS_BETWEEN_ATTEMPTS: 15
        run: |
          for _ in $(seq "$PUBLISH_ATTEMPTS"); do
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md && exit 0
            sleep "$SECONDS_BETWEEN_ATTEMPTS"
          done
          exit 1

  binary:
    needs: release
    if: ${{ !cancelled() && github.event_name == 'workflow_run' && needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the release compiler for Cachix
        run: nix build --no-link .#default

  crates:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !github.event.deleted
    concurrency:
      group: crates-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CRATES: knave-expand knave
      CRATES_IO_API: https://crates.io/api/v1/crates
      CRATES_IO_USER_AGENT: knave-release (https://github.com/knave-lang/knave)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
      - name: Verify the crates before the token is issued
        run: |
          read -ra crates <<< "$CRATES"
          metadata=$(nix develop .#ci -c cargo metadata --locked --no-deps --format-version 1)
          for crate in "${crates[@]}"; do
            version=$(jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version' <<< "$metadata")
            if [ "$version" != "${TAG#v}" ]; then
              echo "::error::$TAG does not match $crate's version ${version:-(none)}"
              exit 1
            fi
          done
          nix develop .#ci -c cargo package --locked "${crates[@]/#/--package=}"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish the crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=${TAG#v}
          missing=()
          for crate in $CRATES; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --user-agent "$CRATES_IO_USER_AGENT" "$CRATES_IO_API/$crate/$version")
            case $status in
              200) echo "::notice::$crate $version is already on crates.io, skipping it" ;;
              404) missing+=("--package=$crate") ;;
              *) echo "::error::crates.io answered $status for $crate $version"; exit 1 ;;
            esac
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            nix develop .#ci -c cargo publish --locked "${missing[@]}" ||
              { echo "::error::cargo publish failed for ${missing[*]} at $version"; exit 1; }
          fi
