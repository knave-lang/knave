name: CRAP forecast
run-name: CRAP forecast of ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      also:
        description: More `cargo test` arguments to run under coverage, one set per line, such as --test stages emit_fixtures
        default: ""
        type: string

concurrency:
  group: crap-forecast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHIX_CACHE: rslisp

jobs:
  forecast:
    name: CRAP forecast
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
      OUTPUT: target/crap-forecast/output.txt
      VERDICT: target/crap-forecast/verdict.txt
    steps:
      - name: Refuse the default branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Dispatch the forecast on a pull request's head branch, not on the default branch."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/dev-shell
        with:
          build-cache: coverage
      - name: Forecast CI's CRAP gate on the changed functions
        id: forecast
        timeout-minutes: 40
        shell: bash
        env:
          ALSO: ${{ inputs.also }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          runs=()
          while IFS= read -r run; do
            if [[ $run =~ [^[:space:]] ]]; then runs+=("$run"); fi
          done <<< "$ALSO"
          mkdir -p "$(dirname "$OUTPUT")"
          {
            echo "commit: $GITHUB_SHA"
            for run in "${runs[@]}"; do echo "also: $run"; done
          } | tee "$OUTPUT"
          nix develop .#ci -c cargo xtask crap-forecast --base "origin/$DEFAULT_BRANCH" --verdict "$VERDICT" "${runs[@]/#/--also=}" 2>&1 | tee -a "$OUTPUT"
      - name: Report the verdict
        if: ${{ !cancelled() && steps.forecast.outcome != 'skipped' }}
        shell: bash
        env:
          FORECAST_OUTCOME: ${{ steps.forecast.outcome }}
        run: |
          if [ ! -f "$VERDICT" ]; then
            outcome="stopped before its verdict"
          elif [ "$FORECAST_OUTCOME" = success ]; then
            outcome=passes
          else
            outcome=fails
          fi
          {
            echo "## The CRAP forecast of ${GITHUB_SHA::7} $outcome"
            echo
            echo '```text'
            cat "$OUTPUT"
            echo '```'
            if [ -f "$VERDICT" ]; then
              echo
              echo "### Verdict"
              echo
              echo '```text'
              cat "$VERDICT"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.forecast.outcome != 'skipped' }}
        with:
          name: crap-forecast
          path: target/crap-forecast/
          retention-days: 7
