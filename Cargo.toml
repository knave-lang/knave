[package]
name = "knave"
version.workspace = true
edition = "2024"
description = "A Lisp programming language for humans and agents that infers types and ownership and compiles to readable Rust"
homepage = "https://knave-lang.org"
keywords = ["programming-language", "lisp", "compiler", "transpiler", "type-inference"]
categories = ["compilers", "command-line-utilities"]
license = "MIT"
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
include = ["/build.rs", "/src/", "/prelude/runtime/", "/README.md", "/LICENSE"]

[workspace]
members = ["expand", "xtask"]

[workspace.package]
version = "0.14.11"
repository = "https://github.com/knave-lang/knave"
rust-version = "1.88"

[workspace.dependencies]
rustc-hash = "2.1"

[workspace.dependencies.knave-expand]
path = "expand"
version = "=0.14.11"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5.2"
knave-expand = { workspace = true }
rustc-hash = { workspace = true }
rustyline = { version = "19.0.0", default-features = false, features = ["buffer-redux", "custom-bindings", "with-file-history"] }
serde_json = "1"
similar = "2.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[build-dependencies]
knave-expand = { workspace = true }

[dev-dependencies]
insta = { version = "1", features = ["glob"] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
counters = []

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"

[profile.local]
inherits = "release"
codegen-units = 16
lto = false
